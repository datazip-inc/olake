syntax = "proto3";

package io.debezium.server.iceberg.rpc;

option go_package = "iceberg/proto";
option java_outer_classname = "RecordIngest";

service RecordIngestService {
  rpc SendRecords(IcebergPayload) returns (RecordIngestResponse);
}

message IcebergPayload {
  enum PayloadType {
    RECORDS = 0;
    COMMIT = 1;
    EVOLVE_SCHEMA = 2;
    DROP_TABLE = 3;
    GET_OR_CREATE_TABLE = 4;
    REFRESH_TABLE_SCHEMA = 5;
    CLOSE_SESSION = 6;
  }
  
  PayloadType type = 1;

  // How a superseded row's removal is expressed: EQUALITY (no index), POSITION (needs table index, rejected on v3), or DELETION_VECTOR (v3 Puffin bitmap, needs table index); UNSPECIFIED is rejected, not a default.
  enum DeleteMode {
    DELETE_MODE_UNSPECIFIED = 0;
    DELETE_MODE_EQUALITY = 1;
    DELETE_MODE_POSITION = 2;
    DELETE_MODE_DELETION_VECTOR = 3;
  }

  message Metadata {
    string dest_table_name = 1;
    string thread_id = 2;
    optional string identifier_field = 3;
    repeated SchemaField schema = 4;
    string payload = 6;
    // Per-stream context (previously baked into JVM CLI args)
    string namespace = 7;
    bool upsert = 8;
    repeated PartitionField partition_fields = 9;
    // COMMIT: snapshot the caller's table index is checkpointed at. The server
    // refreshes the table and refuses the commit when the tip has moved, so
    // positional deletes built from a stale index cannot be published.
    optional int64 base_snapshot_id = 10;
    // GET_OR_CREATE_TABLE: how this stream expresses deletes. Also decides the
    // format version a newly created table is built at, and is validated against
    // an existing table's version before any writer is built.
    DeleteMode delete_mode = 11;
    // Whether the catalog allows declaring identifier_field on the table; only equality deletes need it declared.
    bool declare_identifier_fields = 12;
  }

  message SchemaField {
    string ice_type = 1;
    string key = 2;
  }

  message PartitionField {
    string field = 1;
    string transform = 2;
  }

  // OPTIMIZED: Replace google.protobuf.Value with typed fields
  message IceRecord {
    // Use oneof for efficient memory usage - only one field type active per record field
    message FieldValue {
      oneof value {
        string string_value = 1;
        int32 int_value = 2;
        int64 long_value = 3;
        float float_value = 4;
        double double_value = 5;
        bool bool_value = 6;
        bytes bytes_value = 7;
      }
    }
    
    repeated FieldValue fields = 1;
    string record_type = 2;  // "u", "c", "r"
    // Prior live location of this identifier, when the caller's table index has
    // one. The Java writer emits a positional delete for (path, position)
    // before writing the new row.
    optional string delete_file_path = 3;
    optional int64 delete_position = 4;
  }

  Metadata metadata = 2;
  repeated IceRecord records = 3;
}

message RecordIngestResponse {
  string result = 1;
  bool success = 2;  // Adding success boolean for better error handling
  string olake_2pc_state = 3;  // GET_OR_CREATE_TABLE: 2PC state JSON from table metadata
  // GET_OR_CREATE_TABLE: id of the table's current snapshot, 0 when the table has
  // no snapshot yet. Compared against the table index's checkpoint to decide whether
  // the index can be reused, refreshed, or has to be rebuilt.
  int64 snapshot_id = 4;
  // GET_OR_CREATE_TABLE: whether the current snapshot still carries equality
  // delete files, which must be migrated before positional deletes take over.
  bool has_equality_deletes = 5;

  // RECORDS: returned when rows are written, detailing where they landed so
  // the sender can update its table index. Order matches the request records.
  repeated FilePositionMap file_position_maps = 6;
}

// FilePositionMap describes row ranges written to a single data file.
// Multiple contiguous ranges within a single batch land under the same file_path.
// example:
  // FilePositionMaps: []*proto.FilePositionMap{
  // 	{
  // 		FilePath: "s3a://warehouse/olake_test/test_table/data/00000-0-1111.parquet",
  // 		Ranges: []*proto.FilePositionMap_Range{
  // 			{
  // 				BatchStartIdx: 0,   // maps to sentRecords[0], sentRecords[1], sentRecords[2]
  // 				StartPosition: 100, // row offset 100 in File 1
  // 				Count:         3,
  // 			},
  // 			{
  // 				BatchStartIdx: 5,   // maps to sentRecords[5], sentRecords[6]
  // 				StartPosition: 103, // row offset 103 in File 1
  // 				Count:         2,
  // 			},
  // 		},
  // 	},
  // },
message FilePositionMap {
  string file_path = 1;

  message Range {
    int32 batch_start_idx = 1;
    int64 start_position = 2;
    int32 count = 3;
  }

  repeated Range ranges = 2;
}

service ArrowIngestService {
  rpc IcebergAPI(ArrowPayload) returns (ArrowIngestResponse);
}

message ArrowPayload {
  enum PayloadType {
    UPLOAD_FILE = 0;
    REGISTER_AND_COMMIT = 1;
    JSONSCHEMA = 2;
    FILEPATH = 3;
    // Rows superseded by this sync, to be encoded as deletion vectors. Only sent
    // under delete_mode DELETION_VECTOR, where the caller writes no delete file of
    // its own: format version 3 rejects Parquet positional deletes, and the
    // positions are already structured data on the caller's side. Sent incrementally
    // during the sync so neither side buffers the whole set.
    DELETION_VECTORS = 4;
  }

  PayloadType type = 1;

  message FileMetadata {
    message PartitionValue {
      oneof value {
        int32 int_value = 1;
        int64 long_value = 2;
        string string_value = 3;
        float float_value = 4;
        double double_value = 5;
        bool bool_value = 6;
      }
    }

    string file_type = 1;
    string file_path = 2;
    int64 record_count = 3;
    repeated PartitionValue partition_values = 5;
  }

  message FileUploadRequest {
    bytes file_data = 1;
    string file_path = 2;
  }

  // Rows to delete, grouped by the data file holding them - which is also how a
  // deletion vector is scoped: one bitmap per data file. Grouping matters, since CDC
  // updates cluster on a few recent data files, so one path per many positions
  // collapses the dominant cost of the message without any compression work.
  message DeletionVectorBatch {
    message Entry {
      string data_file_path = 1;
      repeated int64 positions = 2;
      // Partition the vector is stamped with: the one being WRITTEN when these rows
      // were superseded, not necessarily the one the referenced data file lives in.
      // Matches how the rows path routes the same delete - see the TODO on
      // ArrowDeletionVectorWriter.
      repeated FileMetadata.PartitionValue partition_values = 3;
    }
    repeated Entry entries = 1;
  }

  message Metadata {
    string dest_table_name = 1;
    string thread_id = 2;
    repeated FileMetadata file_metadata = 3;
    optional FileUploadRequest file_upload = 4;
    string payload = 6;
    // REGISTER_AND_COMMIT: snapshot the caller's table index is checkpointed at.
    // The server refuses the commit when the table tip has moved past it.
    optional int64 base_snapshot_id = 7;
    // DELETION_VECTORS only.
    optional DeletionVectorBatch deletion_vectors = 8;
  }

  Metadata metadata = 2;
}

message ArrowIngestResponse {
  string result = 1;
  map<string, string> icebergSchemas = 2;
  // Snapshot the table ended up on after REGISTER_AND_COMMIT, so a caller keeping
  // a table index can checkpoint it without reading the table back.
  optional int64 snapshot_id = 3;
}

// TableIndexService populates and maintains the caller's identifier -> row location
// index, which is what lets deletes be expressed as positional rather than
// equality deletes.
service TableIndexService {
  // ScanTableForIndexing streams the identifier and location of live rows in the table.
  rpc ScanTableForIndexing(TableIndexScanRequest) returns (stream TableIndexScanBatch);
  // MigrateEqualityDeletes rewrites the table's existing equality delete files
  // into equivalent positional delete files in a single atomic commit.
  rpc MigrateEqualityDeletes(MigrateEqualityDeletesRequest) returns (MigrateEqualityDeletesResponse);
}

message TableIndexScanRequest {
  string thread_id = 1;
  // When set, only files added after this snapshot are scanned.
  optional int64 from_snapshot_id = 2;
}

message TableIndexScanBatch {
  message Entry {
    string olake_id = 1;
    string file_path = 2;
    int64 position = 3;
  }

  repeated Entry entries = 1;
  // Snapshot this scan is consistent with, repeated on every batch so the caller
  // can checkpoint the index without a second round trip.
  int64 snapshot_id = 2;
}

message MigrateEqualityDeletesRequest {
  string thread_id = 1;
  // The representation equality deletes get rewritten into: POSITION or
  // DELETION_VECTOR. UNSPECIFIED falls back to the session's own delete mode,
  // which is what gated this RPC being called at all.
  IcebergPayload.DeleteMode target_mode = 2;
}

message MigrateEqualityDeletesResponse {
  // Snapshot created by the rewrite, or the unchanged current snapshot when the
  // table had no equality deletes to migrate.
  int64 snapshot_id = 1;
  int64 rewritten_delete_files = 2;
  int64 positional_deletes_written = 3;
}
