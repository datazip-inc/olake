syntax = "proto3";

package io.debezium.server.iceberg.rpc;

option go_package = "iceberg/proto";
option java_outer_classname = "RecordIngest";

service RecordIngestService {
  rpc SendRecords(IcebergPayload) returns (RecordIngestResponse);
}

message IcebergPayload {
  enum PayloadType {
    RECORDS = 0;
    COMMIT = 1;
    EVOLVE_SCHEMA = 2;
    DROP_TABLE = 3;
    GET_OR_CREATE_TABLE = 4;
    REFRESH_TABLE_SCHEMA = 5;
    CLOSE_SESSION = 6;
  }
  
  PayloadType type = 1;

  message Metadata {
    string dest_table_name = 1;
    string thread_id = 2;
    optional string identifier_field = 3;
    repeated SchemaField schema = 4;
    string payload = 6;
    // Per-stream context (previously baked into JVM CLI args)
    string namespace = 7;
    bool upsert = 8;
    // When true, the writer resolves superseding rows via positional deletes
    // (fed by the caller's row index) instead of equality deleteKey.
    bool use_positional_deletes = 9;
    repeated PartitionField partition_fields = 10;
    // Delete representation the writer should use: "eq" (equality deletes),
    // "pos" (positional delete files) or "dv" (v3 deletion vectors). Empty falls
    // back to use_positional_deletes so older callers keep working.
    string delete_mode = 12;
    // COMMIT: snapshot the caller's row index is checkpointed at. The server
    // refreshes the table and refuses the commit when the tip has moved, so
    // positional deletes built from a stale index cannot be published.
    optional int64 base_snapshot_id = 11;
  }

  message SchemaField {
    string ice_type = 1;
    string key = 2;
  }

  message PartitionField {
    string field = 1;
    string transform = 2;
  }

  // OPTIMIZED: Replace google.protobuf.Value with typed fields
  message IceRecord {
    // Use oneof for efficient memory usage - only one field type active per record field
    message FieldValue {
      oneof value {
        string string_value = 1;
        int32 int_value = 2;
        int64 long_value = 3;
        float float_value = 4;
        double double_value = 5;
        bool bool_value = 6;
        bytes bytes_value = 7;
      }
    }
    
    repeated FieldValue fields = 1;
    string record_type = 2;  // "u", "c", "r"
    // Prior live location of this identifier, when the caller's row index has
    // one. The Java writer emits a positional delete for (path, position)
    // before writing the new row.
    optional string delete_file_path = 3;
    optional int64 delete_position = 4;
  }

  Metadata metadata = 2;
  repeated IceRecord records = 3;
}

message RecordIngestResponse {
  string result = 1;
  bool success = 2;  // Adding success boolean for better error handling
  string olake_2pc_state = 3;  // GET_OR_CREATE_TABLE: 2PC state JSON from table metadata
  // GET_OR_CREATE_TABLE: id of the table's current snapshot, 0 when the table has
  // no snapshot yet. Compared against the row index's checkpoint to decide whether
  // the index can be reused, refreshed, or has to be rebuilt.
  int64 snapshot_id = 4;
  // GET_OR_CREATE_TABLE: whether the current snapshot still carries equality
  // delete files, which must be migrated before positional deletes take over.
  bool has_equality_deletes = 5;

  // RECORDS: returned when rows are written, detailing where they landed so
  // the sender can update its row index. Order matches the request records.
  repeated WriteRun write_runs = 6;
}

// WriteRun describes a contiguous block of rows written to a single data file.
// Because Java writes records sequentially, a batch of records typically maps
// to just one or two runs (if a file rolled).
message WriteRun {
  string file_path = 1;
  int32 batch_start_idx = 2;
  int64 start_position = 3;
  int32 count = 4;
}

service ArrowIngestService {
  rpc IcebergAPI(ArrowPayload) returns (ArrowIngestResponse);
}

message ArrowPayload {
  enum PayloadType {
    UPLOAD_FILE = 0;
    REGISTER_AND_COMMIT = 1;
    JSONSCHEMA = 2;
    FILEPATH = 3;
  }

  PayloadType type = 1;

  message FileMetadata {
    message PartitionValue {
      oneof value {
        int32 int_value = 1;
        int64 long_value = 2;
        string string_value = 3;
        float float_value = 4;
        double double_value = 5;
        bool bool_value = 6;
      }
    }

    string file_type = 1;
    string file_path = 2;
    int64 record_count = 3;
    repeated PartitionValue partition_values = 5;
  }

  message FileUploadRequest {
    bytes file_data = 1;
    string file_path = 2;
  }

  message Metadata {
    string dest_table_name = 1;
    string thread_id = 2;
    repeated FileMetadata file_metadata = 3;
    optional FileUploadRequest file_upload = 4;
    string payload = 6;
    // REGISTER_AND_COMMIT: snapshot the caller's row index is checkpointed at.
    // The server refuses the commit when the table tip has moved past it.
    optional int64 base_snapshot_id = 7;
  }

  Metadata metadata = 2;
}

message ArrowIngestResponse {
  string result = 1;
  map<string, string> icebergSchemas = 2;
  // Snapshot the table ended up on after REGISTER_AND_COMMIT, so a caller keeping
  // a row index can checkpoint it without reading the table back.
  optional int64 snapshot_id = 3;
}

// RowIndexService populates and maintains the caller's identifier -> row location
// index, which is what lets deletes be expressed as positional rather than
// equality deletes.
service RowIndexService {
  // ScanRowIndex streams the identifier and location of live rows in the table.
  rpc ScanRowIndex(RowIndexScanRequest) returns (stream RowIndexScanBatch);
  // MigrateEqualityDeletes rewrites the table's existing equality delete files
  // into equivalent positional delete files in a single atomic commit.
  rpc MigrateEqualityDeletes(MigrateEqualityDeletesRequest) returns (MigrateEqualityDeletesResponse);
}

message RowIndexScanRequest {
  string thread_id = 1;
  // When set, only files added after this snapshot are scanned. The server
  // answers with requires_full_scan when the range cannot be served
  // incrementally, for instance because a compaction rewrote existing files and
  // invalidated the positions already held by the caller.
  optional int64 from_snapshot_id = 2;
}

message RowIndexScanBatch {
  message Entry {
    string olake_id = 1;
    string file_path = 2;
    int64 position = 3;
    bool deleted = 4;
    // 5 held sequence_number, which no consumer read: the scan already emits
    // files oldest first, so overwriting entries as they arrive leaves the
    // newest version of each identifier without comparing sequence numbers.
    reserved 5;
    reserved "sequence_number";
  }

  repeated Entry entries = 1;
  // Snapshot this scan is consistent with, repeated on every batch so the caller
  // can checkpoint the index without a second round trip.
  int64 snapshot_id = 2;
  // Set on a single empty batch when an incremental scan was requested but the
  // caller must discard its index and ask for a full scan instead.
  bool requires_full_scan = 3;
}

message MigrateEqualityDeletesRequest {
  string thread_id = 1;
  // Representation the equality deletes should be rewritten into: "pos" or "dv".
  // Empty means "pos", which is what callers predating deletion vectors expect.
  string target_mode = 2;
}

message MigrateEqualityDeletesResponse {
  // Snapshot created by the rewrite, or the unchanged current snapshot when the
  // table had no equality deletes to migrate.
  int64 snapshot_id = 1;
  int64 rewritten_delete_files = 2;
  int64 positional_deletes_written = 3;
}
