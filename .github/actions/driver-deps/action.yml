name: Driver external dependencies
description: Restores what prepare.<driver> provisions on the build host, keyed on the fragments that override prepare.

inputs:
  save:
    description: Publish the cache at the end of the job as well as restoring it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve key
      id: key
      shell: bash
      run: |
        fragments=$(grep -l '^prepare\.' drivers/*/driver.mk || true)
        digest=$(cat $fragments /dev/null | sha256sum | cut -c1-16)
        echo "value=${{ runner.os }}-${{ runner.arch }}-driver-deps-$digest" >> "$GITHUB_OUTPUT"

    - if: inputs.save == 'true'
      uses: actions/cache@v4
      with:
        path: ~/clidriver
        key: ${{ steps.key.outputs.value }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-driver-deps-

    - if: inputs.save != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/clidriver
        key: ${{ steps.key.outputs.value }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-driver-deps-
