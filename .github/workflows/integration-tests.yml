name: Integration Tests

on:
  # No path filter on master: a merge there is a release, so it runs every driver regardless of
  # what the diff touched.
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "*"
    paths:
      - '**/*.go'
      - '**/*.java'
      - '**/go.mod'
      - '**/go.work'
      - '**/pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Makefile'
      - 'drivers/**.conf'
      - 'drivers/*/driver.mk'
      - 'drivers/*/docker-compose.yml'
      - 'destination/iceberg/local-test/**'
      - 'tests/**'
      - '.github/workflows/integration-tests.yml'
      - '.github/actions/detect-drivers/action.yml'

jobs:
  # Ungated, like the three cache jobs below it: the environment prompts once per wave of jobs that
  # reach it, so gating these too would cost three approvals a run. Also runs the tests modules'
  # lint and gosec on the restored Go cache: this runner is already up on every run, so the
  # checks cost no extra machine.
  preflight:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      drivers: ${{ steps.drivers.outputs.drivers }}
      jar-cached: ${{ steps.jar-cache.outputs.cache-hit }}
      go-cached: ${{ steps.go-cache.outputs.cache-hit }}
      go-key: ${{ steps.go-cache.outputs.cache-primary-key }}
      apt-warmed: ${{ steps.apt-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Shared with any workflow that wants to skip untouched drivers; the matrix below fans out
      # over whatever it returns, and an empty array skips the driver jobs entirely.
      - name: Resolve driver matrix
        id: drivers
        uses: ./.github/actions/detect-drivers

      # lookup-only answers "already built?" without downloading the 362MB jar. No restore-keys:
      # a fallback would report a stale jar as a hit and every driver would test the wrong writer.
      - name: Look up Iceberg writer jar cache
        id: jar-cache
        uses: actions/cache/restore@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}
          lookup-only: true

      # Keyed on the deps AND the harness source, so editing testutils republishes the cache instead
      # of leaving eight jobs to recompile it. A real restore, not lookup-only: the lint and gosec
      # steps below run on it. cache-hit stays true only on the exact key, so the go-cached output
      # still tells go-cache when to publish; the prefix fallback just hands the checks an older
      # module set and golangci-lint binary to work with.
      - name: Restore Go module + build cache
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: ${{ runner.os }}-gobase-${{ hashFiles('tests/**/go.mod', 'tests/go.work', 'tests/testutils/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-gobase-

      # A marker, since buildx's own gha cache keys are internal and cannot be looked up: it records
      # that the runtime-base stage was warmed. Eviction can outdate it, and a miss is only a slow build.
      - name: Look up base docker layer marker
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: .apt-warmed
          key: ${{ runner.os }}-aptwarm-${{ hashFiles('Dockerfile') }}
          lookup-only: true

      # setup-go's cache keys on go.sum, which this repo does not track, so it would cache nothing.
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
          cache: false

      # golangci.install inside is skipped when the restored cache already carries the binary.
      - name: golangci-lint tests modules
        run: make test.lint

      - name: install gosec
        env:
          GOSEC_VERSION: v2.22.11
        run: $(go env GOPATH)/bin/gosec --version 2>/dev/null | grep -q "${GOSEC_VERSION#v}" || curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin $GOSEC_VERSION

      - name: Run Gosec on tests modules
        working-directory: tests
        run: $(go env GOPATH)/bin/gosec -exclude=G115 -tests -severity=high -confidence=medium ./...

  # Only when the jar is missing: preflight already looked up the cache, so an unchanged writer
  # skips Maven and this whole job.
  build-jar:
    name: Build Iceberg writer jar
    needs: preflight
    if: needs.preflight.outputs.jar-cached != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java for Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Iceberg writer jar
        run: make iceberg.jar

      # Under the key preflight looked up and the driver jobs restore from.
      - name: Save Iceberg writer jar cache
        uses: actions/cache/save@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}

  # Skipped while the Dockerfile is unchanged and already warmed. Failure here is never fatal: the
  # driver build just re-runs the layers it would have hit from cache.
  apt-warm:
    name: Warm base docker layers
    needs: preflight
    if: needs.preflight.outputs.apt-warmed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Self-hosted runners do not export the Actions cache token; without it buildx caches nothing.
      - name: Expose GitHub Actions cache token
        uses: crazy-max/ghaction-github-runtime@v3

      # Exits 0 either way: a failed warm must not block the matrix, it only leaves those layers to
      # the driver build. The marker is what tells the next run to try again.
      - name: Warm base docker layers
        run: |
          docker buildx build --target runtime-base \
            --cache-to type=gha,mode=max,scope=olake-base --cache-from type=gha,scope=olake-base . \
            && echo "$GITHUB_SHA" > .apt-warmed \
            || echo "::warning::base layer warm failed (non-fatal)"

      # Only on success, so a failed warm leaves the marker missing and the next run retries.
      - name: Save base layer marker
        if: hashFiles('.apt-warmed') != ''
        uses: actions/cache/save@v4
        with:
          path: .apt-warmed
          key: ${{ runner.os }}-aptwarm-${{ hashFiles('Dockerfile') }}

  # The modules and compiled shared deps every driver job restores. Skipped while the cache already
  # holds an entry for this dependency set and harness source.
  go-cache:
    name: Publish Go module + build cache
    needs: preflight
    if: needs.preflight.outputs.go-cached != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # setup-go's cache keys on go.sum, which this repo does not track, so it would cache nothing.
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
          cache: false

      # An exact hit is impossible here (preflight already found none), so this only picks up a
      # near-miss from an earlier dependency set to build on; the post-job save publishes the result.
      - name: Cache Go modules + build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: ${{ needs.preflight.outputs.go-key }}
          restore-keys: |
            ${{ runner.os }}-gobase-

      # Every tests module, not just testutils, so the matrix jobs download nothing.
      - name: Download Go modules
        run: cd tests && for d in $(go list -m -f '{{.Dir}}'); do go -C "$d" mod download; done

      # The same targets the driver jobs run, so their compile and link both hit this cache.
      - name: Compile the driver test binaries
        run: make test.build.all

  # One job per driver, each on its own VM with its own Docker daemon: it brings up its own source
  # plus destination stack, builds its own image and runs every suite for that driver.
  integration-tests:
    name: Test ${{ matrix.driver }}
    needs: [preflight, build-jar, apt-warm, go-cache]
    # Every need above this can legitimately be skipped, and a skipped need would otherwise skip
    # this too -- so gate on "not failed" rather than on success. go-cache is exempt entirely: it
    # only warms a cache, and it now downloads db2's clidriver, which must not block seven drivers.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.drivers != '[]' && needs.build-jar.result != 'failure' && needs.apt-warm.result != 'failure' }}
    runs-on: 16gb-runner
    # The whole workflow's approval, deliberately on the only job that spends a 16gb runner: one
    # prompt releases every driver, and "Re-run failed jobs" re-enters it so a replay costs another.
    environment: integration_tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.preflight.outputs.drivers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The iceberg catalog's postgres runs as uid 999 and has to own its bind mount.
      - name: Set up Data Directories
        run: |
          sudo mkdir -p destination/iceberg/local-test/data/{postgres-data,minio-data,ivy-cache}
          sudo chown -R 999:999 destination/iceberg/local-test/data
          sudo chmod -R 777 destination/iceberg/local-test/data

      # Bounded so a wedged pull is a killed step rather than the job's whole budget.
      - name: Start containers
        id: containers
        background: true
        timeout-minutes: 15
        run: make -j2 --output-sync=target olake.${{ matrix.driver }}.up olake.destination.all.up

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Self-hosted runners do not export the Actions cache token; without it buildx caches nothing.
      - name: Expose GitHub Actions cache token
        uses: crazy-max/ghaction-github-runtime@v3

      # fail-on-cache-miss: the Dockerfile COPYs this jar and there is no Maven here to rebuild it.
      - name: Restore Iceberg writer jar
        uses: actions/cache/restore@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}
          fail-on-cache-miss: true

      # The cache preserves the jar's original mtime while checkout stamps the writer sources with
      # now, so make would rebuild it here with Maven. The key already proves it matches the sources.
      - name: Mark the restored jar up to date
        run: touch destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar

      # Background: the ~600MB Go cache restore below overlaps it instead of delaying it. No
      # --cache-to -- exporting this build measured ~119s against the ~85s build it would save.
      - name: Build driver image
        id: image
        background: true
        timeout-minutes: 20
        run: make docker.${{ matrix.driver }}.build DOCKER_BUILD="docker buildx build --progress=plain --cache-from type=gha,scope=olake-base --cache-from type=gha,scope=olake-${{ matrix.driver }} --load"

      # setup-go's cache keys on go.sum, which this repo does not track, so it would cache nothing.
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
          cache: false

      # Restore-only, from preflight: the modules and compiled shared deps are identical for
      # every driver, and seven jobs saving a ~350MB copy each would evict the jar from the cache.
      - name: Restore shared Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: ${{ needs.preflight.outputs.go-key }}
          restore-keys: |
            ${{ runner.os }}-gobase-

      # Compiles the test binary while the container pull and the image build are still in flight.
      - name: Install Dependencies
        id: go-build
        timeout-minutes: 15
        run: make test.build.${{ matrix.driver }}

      - name: Wait for background jobs
        wait: [containers, image, go-build]

      - name: Wait for source + destination readiness
        timeout-minutes: 3
        run: make -j2 --output-sync=target olake.${{ matrix.driver }}.wait olake.destination.all.wait

      # Serial, once: olake processes reaching a fresh catalog race each other's CREATE TABLE on
      # iceberg_tables, and the harness has no runtime fallback for that.
      - name: Check destination (bootstrap Iceberg catalog)
        run: |
          set -euo pipefail
          host_dir="tests/${{ matrix.driver }}/testdata"
          cfg=$(find "$host_dir" -name iceberg_destination.json | sort | head -1)
          rel=${cfg#"$host_dir/"}
          echo "Bootstrapping Iceberg catalog via '${{ matrix.driver }}' ($rel)..."
          docker run --rm \
            -v "$PWD/$host_dir:/testdata" \
            --add-host host.docker.internal:host-gateway \
            -e TELEMETRY_DISABLED=true \
            "olake/source-${{ matrix.driver }}:local" \
            check --destination "/testdata/$rel"

      # Integration + 2PC + (kafka) Rebalance in one go test, against the image built above.
      - name: Run tests
        env:
          OLAKE_DRIVER_IMAGE: olake/source-${{ matrix.driver }}:local
        run: make test.driver.${{ matrix.driver }}
