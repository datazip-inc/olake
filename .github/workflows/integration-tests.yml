name: Integration Tests

on:
  push:
    branches:
      - "master"
    paths:
      - '**/*.go'
      - '**/*.java'
      - '**/go.mod'
      - 'go.work'
      - 'Dockerfile'
      - 'base.Dockerfile'
      - 'Makefile'
      - 'drivers/*/driver.mk'
      - 'drivers/platforms.conf'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches:
      - "*"
    paths:
      - '**/*.go'
      - '**/*.java'
      - '**/go.mod'
      - 'go.work'
      - 'Dockerfile'
      - 'base.Dockerfile'
      - 'Makefile'
      - 'drivers/*/driver.mk'
      - 'drivers/platforms.conf'
      - '.github/workflows/integration-tests.yml'

jobs:
  # Single manual-approval gate for the WHOLE workflow. It is the ONLY job bound to the
  # `integration_tests` environment (required reviewers), and every other job transitively needs it,
  # so NOTHING -- not even detect-changes -- runs until a reviewer approves; and because it is the
  # only gated job, one approval releases the entire run (no downstream re-approval).
  approve:
    name: Approve integration tests
    runs-on: ubuntu-latest
    environment: integration_tests
    steps:
      - run: echo "Approved -- running detect-changes, warm, and the driver matrix."

  # Decides which driver jobs run: a PR touching only drivers/<d>/** runs that driver alone; shared
  # code (root module, harness, destination, Dockerfile, Makefile) fans out to every driver. Pushes
  # to master always run the full matrix (make print.source-drivers).
  detect-changes:
    name: Detect changed drivers
    needs: approve
    runs-on: ubuntu-latest
    outputs:
      drivers: ${{ steps.drivers.outputs.drivers }}
    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared: &shared
              - 'go.work'
              - 'go.mod'
              - 'Dockerfile'
              - 'base.Dockerfile'
              - 'Makefile'
              - 'connector.go'
              - 'constants/**'
              - 'destination/**'
              - 'pkg/**'
              - 'protocol/**'
              - 'types/**'
              - 'utils/**'
              - 'drivers/abstract/**'
              - 'drivers/platforms.conf'
              - '.github/workflows/integration-tests.yml'
            mysql:
              - *shared
              - 'drivers/mysql/**'
            postgres:
              - *shared
              - 'drivers/postgres/**'
            mongodb:
              - *shared
              - 'drivers/mongodb/**'
            mssql:
              - *shared
              - 'drivers/mssql/**'
            db2:
              - *shared
              - 'drivers/db2/**'
            oracle:
              - *shared
              - 'drivers/oracle/**'
            kafka:
              - *shared
              - 'drivers/kafka/**'

      - name: Resolve driver matrix
        id: drivers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 'shared' is only an anchor for the per-driver filters, drop it from the matrix.
            drivers=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared"))')
          else
            drivers=$(make -s print.source-drivers | tr ' ' '\n' | jq -Rc '[., inputs] | map(select(. != ""))')
          fi
          echo "drivers=$drivers" >> "$GITHUB_OUTPUT"
          echo "Running integration tests for: $drivers"

  # One runner warms what every matrix leg consumes: the Iceberg writer jar (each driver image COPYs
  # it), cached and keyed on its own sources so an unchanged writer skips Maven. The apt base layer
  # is warmed via buildx gha cache. Best-effort where it can be; the jar is fatal.
  warm:
    name: Warm caches + build jar
    needs: approve
    runs-on: 16gb-runner
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java for Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache token
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Look up Iceberg writer jar cache
        id: jar-cache
        uses: actions/cache/restore@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}
          lookup-only: true

      - name: Cache Maven dependencies
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Iceberg writer jar
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: make iceberg.jar

      - name: Save Iceberg writer jar cache
        if: steps.jar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}

  # ONE job per driver via the matrix -- each a fresh VM with its own Docker daemon: its own source
  # + destination stacks, its own image build. Drivers run in parallel; fail-fast off so one
  # driver's failure does not cancel the others.
  integration-tests:
    name: ${{ matrix.driver }}
    needs: [detect-changes, warm]
    if: needs.detect-changes.outputs.drivers != '[]'
    runs-on: 16gb-runner
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ fromJSON(needs.detect-changes.outputs.drivers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start containers
        id: containers
        # Bounded so a wedged pull surfaces as a killed step rather than eating the job's budget.
        timeout-minutes: 15
        run: make -j2 --output-sync=target db.${{ matrix.driver }}.up db.destination.all.up

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Cache Go modules + build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.driver }}-${{ hashFiles('go.mod', format('drivers/{0}/go.mod', matrix.driver)) }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.driver }}-
            ${{ runner.os }}-go-

      - name: Compile test binary
        run: make test.build.${{ matrix.driver }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache token
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Restore Iceberg writer jar
        uses: actions/cache/restore@v4
        with:
          path: destination/iceberg/olake-iceberg-java-writer/target/olake-iceberg-java-writer-0.0.1-SNAPSHOT.jar
          key: ${{ runner.os }}-iceberg-jar-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml', 'destination/iceberg/olake-iceberg-java-writer/src/**') }}
          fail-on-cache-miss: true

      - name: Build driver image
        run: make docker.${{ matrix.driver }}.build DOCKER_BUILD="docker buildx build --progress=plain --cache-from type=gha,scope=olake-${{ matrix.driver }} --cache-to type=gha,mode=max,scope=olake-${{ matrix.driver }} --load"

      - name: Wait for source + destination readiness
        run: make -j2 --output-sync=target db.${{ matrix.driver }}.wait db.destination.all.wait

      # Bootstrap this job's Iceberg JdbcCatalog ONCE, serially, before the tests: olake processes
      # reaching a freshly created catalog concurrently race each other's CREATE TABLE on the catalog
      # bookkeeping tables (iceberg_tables, iceberg_namespace_properties). The harness has no runtime
      # fallback for this race, so this guarantees an initialized catalog.
      - name: Check destination (bootstrap Iceberg catalog)
        run: |
          set -euo pipefail
          host_dir="drivers/${{ matrix.driver }}/internal/testdata"
          # kafka splits fixtures per wire format (testdata/avro, testdata/json); others keep one
          # config at the testdata root.
          cfg=$(find "$host_dir" -name iceberg_destination.json | sort | head -1)
          rel=${cfg#"$host_dir/"}
          echo "Bootstrapping Iceberg catalog via '${{ matrix.driver }}' ($rel)..."
          docker run --rm \
            -v "$PWD/$host_dir:/testdata" \
            --add-host host.docker.internal:host-gateway \
            -e TELEMETRY_DISABLED=true \
            "olake/source-${{ matrix.driver }}:local" \
            check --destination "/testdata/$rel"

      # Runs Integration + 2PC + (kafka) Rebalance in one `go test` (test.driver.<d> = -skip
      # Performance). OLAKE_DRIVER_IMAGE pins the image built above so the harness runs it directly
      # instead of rebuilding. OLAKE_SKIP_DESTINATION_CHECK skips the per-sync catalog round-trip
      # (the Bootstrap step above already validated the destination).
      - name: Run tests
        env:
          OLAKE_DRIVER_IMAGE: olake/source-${{ matrix.driver }}:local
          OLAKE_SKIP_DESTINATION_CHECK: "true"
        run: make test.driver.${{ matrix.driver }}

      # stop, not teardown: teardown deletes the root-owned destination data dir.
      - name: Cleanup
        if: always()
        run: make -j2 db.${{ matrix.driver }}.stop db.destination.all.stop
