name: Test Preflight

on:
  workflow_call:
    inputs:
      suite:
        description: 'Suite being gated, for the approval job name.'
        required: true
        type: string
      environment:
        description: 'Approval environment. Empty runs ungated, which is what a push to a protected branch does.'
        required: false
        default: ''
        type: string
      go-checks:
        description: 'Run lint + gosec with the Go cache job. The suite that owns the checks sets it; the others just consume the cache.'
        required: false
        default: false
        type: boolean
    outputs:
      drivers:
        description: 'JSON array of drivers the caller should fan its matrix out over; [] means nothing to test.'
        value: ${{ jobs.preflight.outputs.drivers }}
      attempt:
        description: 'The run attempt the approval was given on, so a caller can re-prompt on a re-run.'
        value: ${{ jobs.approve.outputs.attempt }}

jobs:
  # Ungated, like the three cache jobs below it: the environment prompts once per wave of jobs that
  # reach it, so gating these too would cost three approvals a run. Cheap: a file list and 3 lookups.
  preflight:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      drivers: ${{ steps.drivers.outputs.drivers }}
      jar-cached: ${{ steps.jar-cache.outputs.cache-hit }}
      go-cached: ${{ steps.go-cache.outputs.cache-hit }}
      go-checks-changed: ${{ steps.go-checks.outputs.changed }}
      apt-warmed: ${{ steps.apt-cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Shared with any workflow that wants to skip untouched drivers; the caller's matrix fans out
      # over whatever it returns, and an empty array skips the driver jobs entirely.
      - name: Resolve driver matrix
        id: drivers
        uses: ./.github/actions/detect-drivers

      - name: Detect go-check input changes
        id: go-checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GO_CHECK_PATHS: |
            tests/**/*.go
            tests/**/go.mod
            tests/go.work
            Makefile
            drivers/*/driver.mk
            .golangci.yml
            .github/workflows/test-preflight.yml
            .github/workflows/tests.yml
        run: |
          changed=$(.github/scripts/changed-in-paths.sh <<<"$GO_CHECK_PATHS")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Go-check inputs changed: $changed"

      - name: Look up Iceberg writer jar cache
        id: jar-cache
        uses: ./.github/actions/iceberg-jar
        with:
          mode: lookup

      - name: Look up Go module + build cache
        id: go-cache
        uses: ./.github/actions/go-caches
        with:
          mode: lookup

      # A marker, since buildx's own gha cache keys are internal and cannot be looked up: it records
      # that the runtime-base stage was warmed. Eviction can outdate it, and a miss is only a slow build.
      - name: Look up base docker layer marker
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: .apt-warmed
          key: ${{ runner.os }}-aptwarm-${{ hashFiles('Dockerfile') }}
          lookup-only: true

  # The run's single approval, last before the matrix so a pre-job failure fails or skips it too --
  # then any re-run re-executes it, and every attempt that reaches the drivers prompts exactly once.
  approve:
    name: Approve ${{ inputs.suite }} tests
    needs: [preflight, build-jar, apt-warm, go-cache]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.drivers != '[]' && needs.build-jar.result != 'failure' && needs.apt-warm.result != 'failure' && needs.go-cache.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    outputs:
      attempt: ${{ github.run_attempt }}
    steps:
      - run: echo "Approved -- running the ${{ inputs.suite }} matrix."

  # Only when the jar is missing: preflight already looked up the cache, so an unchanged writer
  # skips Maven and this whole job.
  build-jar:
    name: Build Iceberg writer jar
    needs: preflight
    if: needs.preflight.outputs.drivers != '[]' && needs.preflight.outputs.jar-cached != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java for Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build Iceberg writer jar
        run: make iceberg.jar

      - name: Save Iceberg writer jar cache
        uses: ./.github/actions/iceberg-jar
        with:
          mode: save

  # Skipped while the Dockerfile is unchanged and already warmed. Failure here is never fatal: the
  # driver build just re-runs the layers it would have hit from cache.
  apt-warm:
    name: Warm base docker layers
    needs: preflight
    if: needs.preflight.outputs.drivers != '[]' && needs.preflight.outputs.apt-warmed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: ./.github/actions/buildx

      # Exits 0 either way: a failed warm must not block the matrix, it only leaves those layers to
      # the driver build. The marker is what tells the next run to try again.
      - name: Warm base docker layers
        run: |
          docker buildx build --target runtime-base \
            --cache-to type=gha,mode=max,scope=olake-base --cache-from type=gha,scope=olake-base . \
            && echo "$GITHUB_SHA" > .apt-warmed \
            || echo "::warning::base layer warm failed (non-fatal)"

      # Only on success, so a failed warm leaves the marker missing and the next run retries.
      - name: Save base layer marker
        if: hashFiles('.apt-warmed') != ''
        uses: actions/cache/save@v4
        with:
          path: .apt-warmed
          key: ${{ runner.os }}-aptwarm-${{ hashFiles('Dockerfile') }}

  # The modules and compiled shared deps every driver job restores, plus the tests modules' lint
  # and gosec; skipped when the cache is published and no go-check input changed in the PR.
  go-cache:
    name: Go checks + cache
    needs: preflight
    if: needs.preflight.outputs.drivers != '[]' && (needs.preflight.outputs.go-cached != 'true' || needs.preflight.outputs.go-checks-changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # setup-go's cache keys on go.sum, which this repo does not track, so it would cache nothing.
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Cache Go modules + build cache
        uses: ./.github/actions/go-caches
        with:
          mode: save

      - name: Cache driver external dependencies
        uses: ./.github/actions/driver-deps
        with:
          save: "true"

      # Every tests module, not just testutils, so the matrix jobs download nothing.
      - name: Download Go modules
        run: cd tests && for d in $(go list -m -f '{{.Dir}}'); do go -C "$d" mod download; done

      # The same targets the driver jobs run, so their compile and link both hit this cache.
      - name: Compile the driver test binaries
        run: make test.build.all

      # Installs golangci-lint as a side effect (the Makefile guard skips it when the restored
      # cache already carries the binary), so it rides into the post-job save with gosec below.
      - name: golangci-lint tests modules
        if: inputs.go-checks
        run: make test.lint

      - name: install gosec
        if: inputs.go-checks
        env:
          GOSEC_VERSION: v2.22.11
        run: $(go env GOPATH)/bin/gosec --version 2>/dev/null | grep -q "${GOSEC_VERSION#v}" || curl -sfL https://raw.githubusercontent.com/securego/gosec/master/install.sh | sh -s -- -b $(go env GOPATH)/bin $GOSEC_VERSION

      - name: Run Gosec on tests modules
        if: inputs.go-checks
        working-directory: tests
        run: $(go env GOPATH)/bin/gosec -exclude=G115 -tests -severity=high -confidence=medium ./...
