name: Kafka Rebalance Tests

on:
  push:
    branches:
      - "master"
    paths:
      - 'pkg/kafka/**'
      - 'drivers/kafka/**'
      - 'tests/kafka/**'
      - 'tests/testutils/**'
      - '.github/workflows/kafka-rebalance-tests.yml'
  pull_request:
    branches:
      - "*"
    paths:
      - 'pkg/kafka/**'
      - 'drivers/kafka/**'
      - 'tests/kafka/**'
      - 'tests/testutils/**'
      - '.github/workflows/kafka-rebalance-tests.yml'

jobs:
  kafka-rebalance-tests:
    environment: integration_tests
    runs-on: 16gb-runner
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Set up Java for Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Before anything starts: the iceberg catalog's postgres runs as uid 999 and
      # needs to own its bind mount. db.destination.all.up only mkdir -p's these,
      # so pre-creating them here settles the ownership.
      - name: Set up Data Directories
        run: |
          sudo mkdir -p destination/iceberg/local-test/data/{postgres-data,minio-data,ivy-cache}
          sudo chown -R 999:999 destination/iceberg/local-test/data
          sudo chmod -R 777 destination/iceberg/local-test/data

      # Before the stacks start: hashFiles walks whatever is in the workspace, and
      # the catalog postgres locks its data dir to 0700 uid 999 the moment it boots,
      # which the runner user cannot read. Keyed on the one pom.xml by path rather
      # than **/pom.xml for the same reason -- no full-workspace walk.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Kafka and the destination stack boot together; nothing blocks until the
      # wait step, so they come up while the steps below run.
      - name: Start Test Infrastructure
        run: make -j --output-sync=target db.kafka.up db.destination.all.up

      - name: Install Go Dependencies
        working-directory: ./tests/testutils
        run: go mod download

      - name: Build Iceberg Sink
        working-directory: ./destination/iceberg/olake-iceberg-java-writer
        run: mvn clean package -DskipTests

      - name: Build Kafka Driver Image
        run: make docker.kafka.build

      - name: Run Kafka Rebalance Tests
        run: make test.kafka.rebalance

      # stop, not teardown: teardown also deletes the root-owned data dir above.
      - name: Cleanup
        if: always()
        run: make -j db.kafka.stop db.destination.all.stop
