# TEMPORARY, run once from a fork branch named master, then close the PR: master's history
# lookup (gh run list --branch master --status success) matches on head branch name only.
name: Performance Tests

on: pull_request

permissions:
  actions: read

jobs:
  migrate-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        driver: [mysql, postgres]
    steps:
    # Last green staging push run (2026-10-06); its artifacts expire 2027-01-04.
    - name: Download staging benchmarks
      uses: actions/download-artifact@v8
      with:
        name: benchmarks_${{ matrix.driver }}
        run-id: 37441162560
        github-token: ${{ github.token }}

    - name: Upload Benchmarks History
      uses: actions/upload-artifact@v7
      with:
        name: benchmarks_${{ matrix.driver }}
        path: benchmarks.json
        retention-days: 90
