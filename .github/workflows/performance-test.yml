name: Performance Tests

on:
  push:
    branches:
    - "staging"
    # TEMPORARY (perf flakiness investigation): run the suite from this branch. Never merges.
    - "temp-pf"
    paths:
    - '**/*.go'
    - '**/*.java'
    # TEMPORARY: without this a push touching only the workflow does not match the filter above.
    - '.github/workflows/performance-test.yml'
  # On-demand runs from any branch. History is always read from staging's last green run, so a
  # dispatch run is a measurement, never a new baseline.
  workflow_dispatch:

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  performance-tests:
    environment: Performance Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - driver: mysql
          driver_upper: MYSQL
          instance_id: 8
        - driver: postgres
          driver_upper: POSTGRES
          instance_id: 9
        # TODO: add benchmark tests for the below databases
        # - driver: mongodb
        #   driver_upper: MONGODB
        #   instance_id: <TBD>
        # - driver: oracle
        #   driver_upper: ORACLE
        #   instance_id: <TBD>
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: "go.mod"

    - name: Restore driver external dependencies
      uses: ./.github/actions/driver-deps

    - name: Set up Java for Maven
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup VPN Client
      if: matrix.driver != 'oracle'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y openvpn iproute2 iputils-ping netcat-openbsd telnet
        sudo mkdir -p /etc/openvpn/client && sudo chmod 700 /etc/openvpn/client
        echo "${{ secrets[format('{0}_OPENVPN_CONFIG', matrix.driver_upper)] }}" | base64 --decode | sudo tee /etc/openvpn/client/client.ovpn > /dev/null
        echo "${{ secrets.OPENVPN_USERNAME }}" | sudo tee /etc/openvpn/client/auth.txt > /dev/null
        sudo chmod 600 /etc/openvpn/client/client.ovpn /etc/openvpn/client/auth.txt
        sudo chown root:root /etc/openvpn/client/client.ovpn /etc/openvpn/client/auth.txt
        sudo openvpn --config /etc/openvpn/client/client.ovpn --daemon ovpn-client --log /var/log/openvpn-client.log --verb 3
        echo "Establishing VPN connection..."
        for i in {1..30}; do
          if ip addr show | grep -q "tun0\|tap0"; then echo "✅ VPN connected"; break; fi
          [ $i -eq 30 ] && { echo "❌ VPN timeout"; sudo cat /var/log/openvpn-client.log; exit 1; }
          sleep 2
        done
        sudo resolvectl dns tun0 ${{ secrets.VPN_DNS_SERVER }}
        sudo resolvectl domain tun0 ~private.postgres.database.azure.com

    - name: Wake up server
      if: matrix.driver != 'oracle'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.TESTING_SERVER_SSH_KEY }}" | base64 --decode > ~/.ssh/key.pem
        chmod 600 ~/.ssh/key.pem
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/key.pem ${{ secrets.TESTING_SERVER_SSH_USER_HOST }} "/usr/local/bin/wake-up ${{ matrix.instance_id }}"
        echo "Waiting 2 minutes for database to be ready..."
        sleep 120

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-session-name: performance_test_gh
        role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install Go Dependencies
      working-directory: ./tests/testutils
      run: go mod download

    - name: Build Iceberg Sink
      working-directory: ./destination/iceberg/olake-iceberg-java-writer
      run: mvn clean package -DskipTests

    # The image the suite runs against. Built here rather than left to the harness, which would
    # otherwise build it inside `go test` where it is invisible in the step timings.
    - name: Build Driver Image
      run: make docker.${{ matrix.driver }}.build

    - name: Create source
      run: |
        echo '${{ secrets[format('{0}_SOURCE_JSON', matrix.driver_upper)] }}' | base64 --decode > ./tests/${{ matrix.driver }}/testdata/source.json

    - name: Create destination
      run: |
        echo '${{ secrets[format('{0}_DESTINATION_JSON', matrix.driver_upper)] }}' | base64 --decode > ./tests/${{ matrix.driver }}/testdata/iceberg_destination.json
    
    - name: Get Last Successful Run ID
      id: last_run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREVIOUS_ID=$(gh run list --workflow ".github/workflows/performance-test.yml" --branch "staging" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
        
        if [ -n "$PREVIOUS_ID" ]; then
          echo "id=$PREVIOUS_ID" >> $GITHUB_OUTPUT
        fi

    - name: Download Benchmarks History
      if: steps.last_run.outputs.id != ''
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: benchmarks_${{ matrix.driver }}
        path: ./tests/${{ matrix.driver }}/testdata/
        run-id: ${{ steps.last_run.outputs.id }}
        github-token: ${{ github.token }}

    # Samples the SOURCE server while the suite runs. The driver profile shows the reader parked
    # in GetEvent; only the server can say why it is not being fed. Runs in a mysql:8 container
    # because the runner has no mysql client. Password goes via MYSQL_PWD and is masked.
    - name: Sample source server during the run
      if: matrix.driver == 'mysql'
      background: true
      run: |
        # A diagnostic must never fail the job, and one bad query must not end the sampling.
        set +e
        mkdir -p ./perf-profile
        cfg=./tests/mysql/testdata/source.json
        host=$(jq -r '.hosts' $cfg); port=$(jq -r '.port' $cfg)
        user=$(jq -r '.username' $cfg); pw=$(jq -r '.password' $cfg)
        echo "::add-mask::$pw"
        q() { docker run --rm --network host -e MYSQL_PWD="$pw" mysql:8 \
                mysql -h "$host" -P "$port" -u "$user" -N -B --connect-timeout=10 -e "$1" 2>&1 || true; }

        {
          echo "== config =="
          # SHOW VARIABLES, not SELECT @@x: -B -N strips column names, so a \\G select
          # returns unlabelled values. This returns name/value pairs.
          q "SHOW GLOBAL VARIABLES WHERE Variable_name IN
              ('hostname','version','version_comment','sync_binlog','max_binlog_size',
               'binlog_cache_size','binlog_row_image','binlog_row_metadata','innodb_io_capacity',
               'innodb_io_capacity_max','innodb_flush_method','innodb_buffer_pool_size',
               'log_bin_basename','innodb_flush_log_at_trx_commit','innodb_log_file_size',
               'innodb_max_dirty_pages_pct','innodb_flush_neighbors','binlog_transaction_compression',
               'binlog_expire_logs_seconds','net_write_timeout','innodb_read_io_threads',
               'performance_schema')"
          echo "-- uptime (status var, not a system var) --"
          q "SHOW GLOBAL STATUS LIKE 'Uptime'"
          echo "-- binlog files on disk --"
          q "SHOW BINARY LOGS" | tail -5
        } >> ./perf-profile/mysql_server.log 2>&1

        while true; do
          {
            echo "== $(date -u +%H:%M:%S) =="
            # THE discriminator: is the dump thread sending, idle-waiting, or blocked?
            echo "-- dump threads --"
            q "SELECT ID, STATE, TIME, COMMAND FROM information_schema.PROCESSLIST
                WHERE COMMAND LIKE 'Binlog Dump%'"
            echo "-- io counters --"
            q "SHOW GLOBAL STATUS WHERE Variable_name IN
                ('Innodb_data_reads','Innodb_data_read','Innodb_data_writes','Innodb_data_written',
                 'Innodb_buffer_pool_pages_dirty','Innodb_os_log_written','Innodb_data_pending_reads',
                 'Innodb_data_pending_writes','Binlog_cache_disk_use','Threads_running',
                 'Innodb_buffer_pool_wait_free','Innodb_log_waits','Innodb_row_lock_waits','Queries')"
            # Filter on the instrument, not the file name: binlogs are 'binlog.N' on some servers
            # and 'mysql-bin.N' on others. us_per_read is the dump thread's own read cost.
            echo "-- binlog file read cost --"
            q "SELECT FILE_NAME, COUNT_READ, ROUND(SUM_TIMER_READ/1e12,3) AS read_s,
                      ROUND(SUM_TIMER_READ/NULLIF(COUNT_READ,0)/1e6,1) AS us_per_read,
                      SUM_NUMBER_OF_BYTES_READ
                 FROM performance_schema.file_summary_by_instance
                WHERE EVENT_NAME='wait/io/file/sql/binlog' AND COUNT_READ>0
                ORDER BY SUM_TIMER_READ DESC LIMIT 3"
          } >> ./perf-profile/mysql_server.log 2>&1
          sleep 2
        done

    # Points the harness at the image built above; without it getOrBuildDriverImage rebuilds it.
    - name: Run Performance Tests
      env:
        OLAKE_DRIVER_IMAGE: olake/source-${{ matrix.driver }}:local
      run: make test.performance.${{ matrix.driver }}

    - name: Upload Benchmarks History
      uses: actions/upload-artifact@v7
      if: success()
      continue-on-error: true
      with:
        name: benchmarks_${{ matrix.driver }}
        path: ./tests/${{ matrix.driver }}/testdata/benchmarks.json
        retention-days: 90

    # Uploaded on failure too: a slow run is exactly the one whose profile we need to diff.
    - name: Upload Performance Profile
      uses: actions/upload-artifact@v7
      if: always()
      continue-on-error: true
      with:
        name: perf_profile_${{ matrix.driver }}_${{ github.run_attempt }}
        path: ./perf-profile/
        retention-days: 30
   
    - name: Sleep server
      if: always() && matrix.driver != 'oracle'
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.TESTING_SERVER_SSH_KEY }}" | base64 --decode > ~/.ssh/key.pem
        chmod 600 ~/.ssh/key.pem
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/key.pem ${{ secrets.TESTING_SERVER_SSH_USER_HOST }} "/usr/local/bin/sleep-off ${{ matrix.instance_id }}"
        rm -f ~/.ssh/key.pem

    - name: Cleanup
      if: always()
      run: |
        # Delete all Glue databases matching prefix
        for db in $(aws glue get-databases \
          --query "DatabaseList[?starts_with(Name, 'performance_${{ matrix.driver }}')].Name" \
          --output text); do
          echo "Deleting Glue database: $db"
          aws glue delete-database --name "$db" \
          || echo "Failed to delete Glue database: $db"
        done

        # Delete corresponding S3 path
        aws s3 rm s3://dz-stag-github-actions/performance_${{ matrix.driver }}/ --recursive \
        || { echo "Failed to delete S3 bucket: performance_${{ matrix.driver }}"; \
        aws s3 ls s3://dz-stag-github-actions/performance_${{ matrix.driver }} || true; }

        echo "Catalog cleanup completed"

        if [[ "${{ matrix.driver }}" != "oracle" ]]; then
            sudo pkill -f "openvpn.*client.ovpn" || true
            sudo rm -rf /etc/openvpn/client/ /var/log/openvpn-client.log || true
            echo "VPN cleanup completed"
        fi
