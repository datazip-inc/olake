name: Integration Test Runner

on:
  workflow_call:
    inputs:
      test_type:
        description: 'Type of tests to run: integration or 2pc'
        required: true
        type: string

jobs:
  run-tests:
    name: ${{ inputs.test_type == '2pc' && '2PC Integration Tests' || 'Integration Tests' }}
    environment: integration_tests
    runs-on: 32gb-runner
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Set up Java for Maven
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # Before anything starts: the iceberg catalog's postgres runs as uid 999 and
      # needs to own its bind mount. db.destination.all.up only mkdir -p's these,
      # so pre-creating them here settles the ownership.
      - name: Set up Data Directories
        run: |
          sudo mkdir -p destination/iceberg/local-test/data/{postgres-data,minio-data,ivy-cache}
          sudo chown -R 999:999 destination/iceberg/local-test/data
          sudo chmod -R 777 destination/iceberg/local-test/data

      # Before the stacks start: hashFiles walks whatever is in the workspace, and
      # the catalog postgres locks its data dir to 0700 uid 999 the moment it boots,
      # which the runner user cannot read. Keyed on the one pom.xml by path rather
      # than **/pom.xml for the same reason -- no full-workspace walk.
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('destination/iceberg/olake-iceberg-java-writer/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # One compose up per source stack plus the destination stack, all at once,
      # so the image pulls overlap instead of queueing. Containers boot in the
      # background while the steps below run; nothing blocks until the wait step.
      - name: Start Test Infrastructure
        run: make -j --output-sync=target db.all.up

      # Host build deps per driver (db2: the IBM clidriver; a no-op for the rest).
      # The cgo env for it comes from GO_ENV.db2 in the test targets, so nothing
      # needs exporting into $GITHUB_ENV here.
      - name: Provision Build Dependencies
        run: make prepare.all

      - name: Install Go Dependencies
        working-directory: ./tests/testutils
        run: go mod download

      - name: Build Iceberg Sink
        working-directory: ./destination/iceberg/olake-iceberg-java-writer
        run: mvn clean package -DskipTests

      - name: Build Test Base Image
        run: make docker.base.build

      # The sync suites run many olake processes concurrently, and the first to reach a freshly
      # created iceberg JdbcCatalog race each other's CREATE TABLE on the shared catalog bookkeeping
      # tables (iceberg_tables, iceberg_namespace_properties). Bootstrap it once, serially, before
      # any tests run, so every later sync finds it initialized. The catalog is shared across all
      # drivers, so one check with any single driver suffices.
      - name: Bootstrap Iceberg Catalog
        run: |
          docker run --rm \
            --add-host host.docker.internal:host-gateway \
            -v "$PWD:/test-olake" \
            -v go-mod:/go/pkg/mod \
            -v go-build:/root/.cache/go-build \
            -w /test-olake \
            -e TELEMETRY_DISABLED=true \
            -e OLAKE_SKIP_MOD_TIDY=1 \
            "$(make -s print.base-image)" \
            ./build.sh driver-mysql check --destination /test-olake/tests/mysql/testdata/iceberg_destination.json

      # test.integration / test.2pc run every driver's suite in parallel from the
      # tests workspace (-p <driver count>), with the per-driver cgo env applied.
      - name: Run Integration Tests
        if: inputs.test_type == 'integration'
        run: make test.integration

      - name: Run 2PC Integration Tests
        if: inputs.test_type == '2pc'
        run: make test.2pc

      # stop, not teardown: teardown also deletes the root-owned data dir above.
      - name: Cleanup
        if: always()
        run: make -j db.all.stop
