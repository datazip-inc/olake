version: "2"

linters:
  settings:
  # depguard:
    # list-type: blacklist
    # packages:
    #   # logging is allowed only by logutils.Log, logrus
    #   # is allowed to use only in logutils package
    #   - github.com/sirupsen/logrus
    # packages-with-error-message:
    #   - github.com/sirupsen/logrus: "logging is allowed only by logutils.Log"
    dupl:
      threshold: 100
    errorlint:
      # %s error formatting is house style; flip to %w codebase-wide before enabling this
      errorf: false
      # err == sentinel and err.(*T) are spread across the codebase; moving them to
      # errors.Is/errors.As is one codebase-wide sweep, to be picked up later in one go
      comparison: false
      asserts: false
    exhaustive:
      default-signifies-exhaustive: false
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G204
    govet:
      enable:
        - nilness
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 950
    misspell:
      locale: US
      ignore-rules:
        - eles
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
    revive:
      enable-default-rules: true
      rules:
        - name: defer
          arguments: [["loop"]]
        - name: atomic
        - name: waitgroup-by-value
        - name: unconditional-recursion
        - name: identical-branches
        - name: constant-logical-expr
        - name: time-equal

  # please, do not use `enable-all`: it's deprecated and will be removed soon.
  # inverted configuration with `enable-all` and `disable` is not scalable during updates of golangci-lint
  default: none
  enable:
    - bodyclose
    # - dupl
    - dogsled
    - errcheck
    # - exhaustive
    # - funlen
    # - goconst
    # - gocritic
    # - gocyclo
    - revive
    - gosec
    # - mnd
    # - goprintffuncname
    - govet
    - ineffassign
    - lll
    - misspell
    # - nakedret
    # - nolintlint
    - staticcheck
    # - unconvert
    # - unparam
    - unused
    - whitespace
    - nilnil
    - nilerr
    - asasalint
    - bidichk
    - durationcheck
    - errorlint
    - makezero
    - nilnesserr
    - rowserrcheck
    - sqlclosecheck

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - mnd

      # Fixture connection strings in test tables spell out fake credentials
      - path: _test\.go
        linters:
          - gosec
        text: "G101:"

      # https://github.com/go-critic/go-critic/issues/926
      - linters:
          - gocritic
        text: "unnecessaryDefer:"
    paths: &exclude-paths
      - test/testdata_etc
      - internal/cache
      - internal/renameio
      - internal/robustio
      # v1 skipped these by default (issues.exclude-dirs-use-default), v2 needs them spelled out
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/golangci/golangci-lint)
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths: *exclude-paths
